[package]
name = "turbocharger"
version = "0.1.0"
edition = "2021"
description = "Foveal codebase vision + ground-truth installed dependency signatures for AI coding agents (CLI + MCP)"
license = "MIT"

[[bin]]
name = "tc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-ident = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
